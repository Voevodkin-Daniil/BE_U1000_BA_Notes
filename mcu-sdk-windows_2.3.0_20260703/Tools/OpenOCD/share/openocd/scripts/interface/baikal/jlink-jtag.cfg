# SEGGER J-Link via JTAG #
#========================#
set ::DEBUGGER_SELECTED 1

source [find interface/jlink.cfg]
transport select jtag

adapter speed 500
adapter srst pulse_width 100
adapter srst delay 500
reset_config srst_only

return
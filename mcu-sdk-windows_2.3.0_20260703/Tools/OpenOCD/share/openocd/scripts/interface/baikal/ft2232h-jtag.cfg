# FT2232H Based Board via JTAG #
#==============================#
set ::DEBUGGER_SELECTED 1

source [find interface/ft2232h.cfg]
ftdi layout_signal nTRST -data 0x0000 -oe 0x0000
ftdi layout_signal nSRST -data 0x0020 -oe 0x0020

adapter speed 500
adapter srst pulse_width 100
adapter srst delay 500
reset_config srst_only

return
proc QSPI_clk_init {} {
	global CRU_CLKSEL_REFCLKSEL_C0 CRU_CLKCR0_CCLKDIV_DIV1 CRU_CLKCR0_CCLKDIV_DIV2 CRU_CLK_SRC_PLL

	___CRU_PLL_BypassMode_Disable

	#Set PLL source clock to C0
	___CRU_PLL_SetSource ${CRU_CLKSEL_REFCLKSEL_C0}

	#Configure PLL to 200 MHz
	___CRU_PLL_ForceReset
	___CRU_PLL_Config 1 48 6 48
	___CRU_PLL_ReleaseReset
	sleep 1

	#Configure CCLK to 200 MHz
	___CRU_SetCCLKPrescaler ${CRU_CLKCR0_CCLKDIV_DIV1}
	___CRU_CCLKPrescaler_Enable
	___CRU_SetCCLKSource ${CRU_CLK_SRC_PLL}

	#Configure PCLK0 to 100 MHz
	___CRU_SetPCLK0Prescaler ${CRU_CLKCR0_CCLKDIV_DIV2}
	___CRU_PCLK0Prescaler_Enable
	___CRU_SetPCLK0Source ${CRU_CLK_SRC_PLL}

	#Configure PCLK1 to 100 MHz
	___CRU_SetPCLK1Prescaler ${CRU_CLKCR0_CCLKDIV_DIV2}
	___CRU_PCLK1Prescaler_Enable
	___CRU_SetPCLK1Source ${CRU_CLK_SRC_PLL}

	#Configure PCLK2 to 100 MHz
	___CRU_SetPCLK2Prescaler ${CRU_CLKCR0_CCLKDIV_DIV2}
	___CRU_PCLK2Prescaler_Enable
	___CRU_SetPCLK2Source ${CRU_CLK_SRC_PLL}

	#Configure HCLK to 100 MHz
	___CRU_SetHCLKPrescaler ${CRU_CLKCR0_CCLKDIV_DIV2}
	___CRU_HCLKPrescaler_Enable
	___CRU_SetHCLKSource ${CRU_CLK_SRC_PLL}

	#Configure 1MHz clocks
	___CRU_SetCCLK1MHzPrescaler 199
	___CRU_SetHCLK1MHzPrescaler 99
}

return
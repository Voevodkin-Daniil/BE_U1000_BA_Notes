proc ___CRU_PLL_BypassMode_Disable {} {
	global CRU CRU_PLLSET_BYPASS
	___clear_bit ${CRU(PLL_CTL)} ${CRU_PLLSET_BYPASS}
}

proc ___CRU_PLL_SetSource {PLLSource} {
	global CRU CRU_CLKSEL_REFCLKSEL
	___modify_reg ${CRU(CLK_SEL)} ${CRU_CLKSEL_REFCLKSEL} ${PLLSource}
}

proc ___CRU_PLL_ForceReset {} {
	global CRU CRU_PLLSET_RESET
	___set_bit ${CRU(PLL_CTL)} ${CRU_PLLSET_RESET}
}

proc ___CRU_PLL_Config {NR NF OD NB} {
	global CRU CRU_PLLSET_CLKR CRU_PLLSET_CLKF CRU_PLLSET_CLKOD CRU_PLLSET_BWADJ CRU_PLLSET_BWADJ_Pos CRU_PLLSET_INTFB CRU_PLLSET_CLKOD_Pos CRU_PLLSET_CLKF_Pos CRU_PLLSET_CLKR_Pos
	___modify_reg ${CRU(PLL_CTL)} $(${CRU_PLLSET_BWADJ} | ${CRU_PLLSET_CLKOD} | ${CRU_PLLSET_CLKF} | ${CRU_PLLSET_CLKR}) $(${CRU_PLLSET_INTFB} | ((${NB}-1) << ${CRU_PLLSET_BWADJ_Pos}) | ((${OD}-1) << ${CRU_PLLSET_CLKOD_Pos}) | ((${NF}-1) << ${CRU_PLLSET_CLKF_Pos}) | ((${NR}-1) << ${CRU_PLLSET_CLKR_Pos}))
}

proc ___CRU_PLL_ReleaseReset {} {
	global CRU CRU_PLLSET_RESET
	___clear_bit ${CRU(PLL_CTL)} ${CRU_PLLSET_RESET}
}

proc ___CRU_SetCCLKPrescaler {Prescaler} {
	global CRU CRU_CLKCR0_CCLKDIV CRU_CLKCR0_CCLKDIV_Pos
	___modify_reg ${CRU(CLK_CTL0)} ${CRU_CLKCR0_CCLKDIV} $(${Prescaler} << ${CRU_CLKCR0_CCLKDIV_Pos})
}

proc ___CRU_CCLKPrescaler_Enable {} {
	global CRU CRU_CLKCR0_CCLKDIVEN
    ___set_bit ${CRU(CLK_CTL0)} ${CRU_CLKCR0_CCLKDIVEN}
}

proc ___CRU_SetCCLKSource {Source} {
